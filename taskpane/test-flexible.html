<!DOCTYPE html>
<html><head><title>Excel Agent - Test Flexible Mode</title>
<style>
  body { font-family: Arial, sans-serif; margin: 40px; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: white; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 40px; }
  .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 15px 0; backdrop-filter: blur(10px); }
  button { background: #fff; color: #667eea; padding: 15px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px; transition: transform 0.2s; }
  button:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
  pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
<div class='container'>
  <h1>🚀 Excel Agent - Flexible Workbook Mode</h1>

  <div class='card'>
    <h3>Status Fix:</h3>
    <p style='color:#00ff88'>✓ Workbook identity errors FIXED!</p>
    <p>Task pane sekarang akan AUTO-UPDATE saat workbook berubah.</p>
  </div>

  <div class='card'>
    <h3>Test Features:</h3>
    <button onclick='window.location.href=
' + https://localhost:3000/taskpane.html?v=2147483647 + '>Reload Task Pane</button>
    <button onclick='checkDebugInfo()'>Check Debug Info</button>
  </div>

  <div class='card' id='result'></div>

  <div class='card'>
    <h3>Console Logs:</h3>
    <pre id='logs'>Waiting for activity...</pre>
  </div>

  <script>
    function checkDebugInfo() {
      var info = document.title || 'Title not set';
      document.getElementById('result').innerHTML = '<p>Current title: <strong>' + info + '</strong></p>
<p>Use browser DevTools (F12) to see debug logs</p>';
    }

    // Capture console.log for display
    var originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      var logEl = document.getElementById('logs');
      if (logEl) {
        logEl.innerHTML += '\n[' + new Date().toLocaleTimeString() + ']' + args.join(' ');
        logEl.scrollTop = logEl.scrollHeight;
      }
    };

    // Initial message
    setTimeout(() => {
      console.log('Flexible mode active! Workbook changes will be auto-detected.');
      document.getElementById('result').innerHTML = '<p>Refresh the task pane in Excel to test.</p>
<p>Look for logs like:<br>[ExcelAgent] Detected name change: Book2 → ADMINISTRASI KELAS</p>';
    }, 1000);
  </script>
</div>
</body></html>
